services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-wautech_crm}
      POSTGRES_USER: ${DB_USERNAME:-${DB_USER:-wautech}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for local development}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
