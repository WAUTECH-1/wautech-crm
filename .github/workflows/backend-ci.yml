name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wautech_crm
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d wautech_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/wautech_crm
      DB_USERNAME: crm_ci
      DB_PASSWORD: ci_only_password

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run complete Maven verification
        run: ./mvnw --batch-mode clean verify
      - name: Start packaged application and verify PostgreSQL migrations
        shell: bash
        run: |
          java -jar target/crm-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/wautech-crm.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness \
                | grep -q '"status":"UP"'; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/wautech-crm.log"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/wautech-crm.log"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/api/health | grep -q '"status":"UP"'
