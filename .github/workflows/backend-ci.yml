name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wautech_crm
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d wautech_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/wautech_crm
      DB_USERNAME: crm_ci
      DB_PASSWORD: ci_only_password

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run complete Maven verification
        run: ./mvnw --batch-mode clean verify
      - name: Run real HTTP CRM integration against disposable fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_password=$(openssl rand -hex 24)
          echo "::add-mask::$fixture_password"
          export WAUTECH_TEST_DB_URL=jdbc:postgresql://127.0.0.1:15432/wautech_integration_fixture
          export WAUTECH_TEST_DB_PASSWORD="$fixture_password"
          export WAUTECH_BROWSER_SMOKE=false
          docker run --detach --name wautech-http-fixture --publish 127.0.0.1:15432:5432 \
            --tmpfs /var/lib/postgresql/data \
            --env POSTGRES_DB=wautech_integration_fixture --env POSTGRES_USER=fixture \
            --env POSTGRES_PASSWORD="$fixture_password" postgres:17
          trap 'docker rm --force wautech-http-fixture >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if docker exec wautech-http-fixture pg_isready -U fixture -d wautech_integration_fixture; then break; fi
            sleep 1
          done
          ./mvnw --batch-mode -Dtest=UnifiedFrontendLiveTest test
      - name: Start packaged application and verify PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/crm-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/wautech-crm.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
                http://127.0.0.1:8080/actuator/health/readiness \
                | grep -q '"status":"UP"'; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/wautech-crm.log"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/wautech-crm.log"
            exit 1
          fi
          if ! curl --fail --silent --show-error --connect-timeout 2 --max-time 10 \
              http://127.0.0.1:8080/api/health | grep -q '"status":"UP"'; then
            echo "Public health smoke check failed" >&2
            cat "$RUNNER_TEMP/wautech-crm.log"
            exit 1
          fi
